---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <time class="muted" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>
  {{ content }}
</article>
<p class="back-link"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
