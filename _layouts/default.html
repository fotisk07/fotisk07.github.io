<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
          <button class="theme-toggle" type="button" hidden aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
          </button>
        </nav>
      </header>
      <main id="main">{{ content }}</main>
      <footer class="site-footer" aria-label="Contact links">
        {% if site.email != '' %}<a href="mailto:{{ site.email | escape }}">Email</a>{% endif %}
        {% if site.github_url != '' %}<a href="{{ site.github_url | escape }}">GitHub</a>{% endif %}
        {% if site.linkedin_url != '' %}<a href="{{ site.linkedin_url | escape }}">LinkedIn</a>{% endif %}
      </footer>
    </div>
  </body>
</html>
